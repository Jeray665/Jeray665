name: Serpiente de contribuciones

on:
  schedule:
    - cron: "0 0 * * *" # cada día a medianoche (UTC)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generar SVG de la serpiente
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#171313&color_dots=#EBE7E3,#F5B5B8,#E8636A,#C8141E,#8E1016
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#F2EEEA&color_dots=#232020,#4A1517,#8E1016,#D81C25,#F5434A

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
